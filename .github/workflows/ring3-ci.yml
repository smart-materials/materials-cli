name: Ring 3 CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ring3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the trusted control files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: control
          persist-credentials: false

      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          persist-credentials: false

      - name: Separate the candidate from the trusted control files
        shell: bash
        run: |
          set -euo pipefail
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin ring3-candidate
          sudo -n chown -R root:root control
          sudo -n chmod -R go-w control
          sudo -n install -o root -g root -m 0555 control/.github/ring3/run-candidate.sh /usr/local/libexec/ring3-run-candidate
          sudo -n mv work /var/tmp/ring3-work
          sudo -n chown -R ring3-candidate:ring3-candidate /var/tmp/ring3-work

      - name: Run the fixed jobs without network access
        working-directory: /var/tmp/ring3-work
        shell: bash
        run: |
          set -euo pipefail
          candidate_uid="$(id -u ring3-candidate)"
          candidate_gid="$(id -g ring3-candidate)"
          sudo -n -u ring3-candidate mkdir -p .ring3-home
          sudo -n unshare --net --pid --fork --mount-proc \
            setpriv --reuid="${candidate_uid}" --regid="${candidate_gid}" --clear-groups \
            env -i HOME="${PWD}/.ring3-home" PATH="${PATH}" CI=true \
            /bin/bash --noprofile --norc /usr/local/libexec/ring3-run-candidate

      - name: Validate the approved artifact
        run: node control/.github/ring3/validate-report.mjs /var/tmp/ring3-work/ring3-output/report.json

      - name: Upload the approved artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ring3-report
          path: /var/tmp/ring3-work/ring3-output/report.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
