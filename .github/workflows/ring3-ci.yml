# The Ring 3 CI workflow for smart-materials/materials-cli. This copy is the
# reviewable source of truth: the manifest pins its sha256, the verifier compares
# that digest against the workflow on the fixed repository's default branch, and
# the upstream file must match this one byte for byte.
#
# pull_request_target runs THIS definition from the base branch, so a candidate
# editing the workflow on its own branch changes nothing. The candidate process
# runs as a dedicated unprivileged user inside network and pid namespaces, so it
# cannot reach the network, the runner's credentials, or the control checkout.
name: Ring 3 CI

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ring3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the trusted control files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: control
          persist-credentials: false

      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          persist-credentials: false

      - name: Create the unprivileged candidate user
        run: |
          sudo useradd --system --create-home --shell /usr/sbin/nologin ring3-candidate
          sudo chown -R ring3-candidate:ring3-candidate work
          # The runner's file-command files (GITHUB_ENV, GITHUB_PATH, GITHUB_OUTPUT)
          # live under RUNNER_TEMP, and GitHub leaves them world-writable so container
          # steps can write them. The candidate step clears its own environment, but it
          # could still list that directory and write NODE_OPTIONS or LD_PRELOAD into a
          # command file; the later Validate and Upload steps run as `runner` and would
          # execute it, which is runner-level code execution and forged CI evidence.
          #
          # The candidate runs as a different uid, so removing non-owner access to the
          # directory denies it the path entirely: writing a file requires search on
          # every parent, and `runner` keeps its own access. The candidate needs nothing
          # under RUNNER_TEMP — it works in `work` with a cleared environment.
          sudo chmod -R go-rwx "${RUNNER_TEMP}"
          # The candidate tree lives outside the runner's home. `/home/runner` is mode
          # 750 runner:runner on the runner image, so a candidate outside that group
          # cannot traverse it: relative opens inside the tree survive, but npm
          # resolves an absolute path, and every candidate job failed with EACCES on
          # package.json. Moving the tree to /var/tmp keeps the candidate off the
          # runner's home entirely, which is tighter than granting traversal into it.
          # The tree is candidate-owned and 0700, so no other local account can read
          # it; `root` still can, which is how the report is collected below.
          sudo mv work /var/tmp/ring3-work
          sudo chown -R ring3-candidate:ring3-candidate /var/tmp/ring3-work
          sudo chmod 0700 /var/tmp/ring3-work

      - name: Run the fixed jobs without network access
        shell: bash
        run: |
          set -uo pipefail
          # The Ring 3 verifier attests this exact command and working directory, so
          # both are fixed here and must not drift.
          candidate_command='npm run lint && npm test && npm run artifact'
          candidate_cwd=/var/tmp/ring3-work
          sudo -n unshare --net --pid --fork --mount-proc \
            setpriv --reuid="$(id -u ring3-candidate)" --regid="$(id -g ring3-candidate)" --clear-groups \
            env -i HOME=/home/ring3-candidate PATH="${PATH}" CI=true \
            /bin/bash --noprofile --norc -euo pipefail -c "
              cd ${candidate_cwd}
              if timeout 5 curl --noproxy '*' --silent --show-error https://api.github.com >/dev/null 2>&1; then
                echo 'The candidate process reached the network.' >&2
                exit 1
              fi
              echo 'network=denied'
              ${candidate_command}
            " &
          candidate_pid=$!
          wait "${candidate_pid}"
          candidate_status=$?
          # The runner emits this, not the candidate: the candidate is the adversary
          # here, so evidence it could print itself would prove nothing. The marker is
          # assembled in code so the echoed step script cannot itself match the line
          # the verifier counts — it requires exactly one.
          node -e 'const marker = `RING3_${"PROCESS"}`; const [pid, ppid, command, cwd, exitStatus] = process.argv.slice(1); console.log(`${marker}|${JSON.stringify({ version: 1, pid: Number(pid), ppid: Number(ppid), command, cwd, exitStatus: Number(exitStatus) })}`);' \
            "${candidate_pid}" "$$" "${candidate_command}" "${candidate_cwd}" "${candidate_status}"
          exit "${candidate_status}"

      - name: Collect the approved artifact
        run: |
          # The tree is candidate-owned and unreadable to `runner`, so root copies the
          # report out. The copy is what the later steps read, so nothing that runs as
          # `runner` opens a path the candidate can still write.
          sudo install -o runner -g runner -m 644 /var/tmp/ring3-work/ring3-output/report.json report.json

      - name: Validate the approved artifact
        run: node control/.github/ring3/validate-report.mjs report.json

      - name: Upload the approved artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ring3-report
          path: report.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
